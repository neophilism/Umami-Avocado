[project]
name = "umami-avocado-api"
version = "0.1.0"
description = "Research-only FastAPI service for Umami Avocado"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = [".", "../worker"]
testpaths = ["tests", "../worker/tests"]

[tool.ruff]
line-length = 100
